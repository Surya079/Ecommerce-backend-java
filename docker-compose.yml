services:
  postgres:
    container_name: ms_pg_sql
    image: postgres:15
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      PGDATA: /var/lib/postgresql/data
    volumes:
      - postgres:/var/lib/postgresql/data
    ports:
      - "5433:5432"
    networks:
      - microservices-net
    restart: unless-stopped

  pgadmin:
    container_name: ms_pgadmin
    image: dpage/pgadmin4
    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_DEFAULT_EMAIL:-pgadmin@pgadmin.org}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_DEFAULT_PASSWORD:-admin}
      PGADMIN_CONFIG_SERVER_MODE: 'False'
    volumes:
      - pgadmin:/var/lib/pgadmin
    ports:
      - "5000:80"
    networks:
      - microservices-net
    restart: unless-stopped

  mongodb:
    container_name: ms_mongo_db
    image: mongo
    ports:
      - "27017:27017"
    environment:
      MONGO_INITDB_ROOT_USERNAME: Surya
      MONGO_INITDB_ROOT_PASSWORD: Surya
    volumes:
      - mongo:/data/db
    networks:
      - microservices-net

  mongo-express:
    container_name: ms_mongo_express
    image: mongo-express
    restart: always
    ports:
        - "8081:8081"
    environment:
      ME_CONFIG_MONGODB_ADMINUSERNAME: Surya
      ME_CONFIG_MONGODB_ADMINPASSWORD: Surya
      ME_CONFIG_MONGODB_SERVER: mongodb
      ME_CONFIG_BASICAUTH_USERNAME: admin
      ME_CONFIG_BASICAUTH_PASSWORD: admin
    networks:
      - microservices-net
    depends_on:
      - mongodb

  kafka:
    image: apache/kafka:3.7.0
    container_name: ms-kafka
    hostname: kafka
    ports:
      - "9092:9092"

    environment:
      KAFKA_NODE_ID: 0
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_QUORUM_VOTERS: 0@kafka:9093

      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:9092,CONTROLLER://0.0.0.0:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER

      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_LOG_DIRS: /var/lib/kafka/data

      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1

    volumes:
      - kafka_data:/var/lib/kafka/data

    networks:
      - microservices-net

    mem_limit: 1g

  mail-dev:
    container_name: ms_email_dev
    image: maildev/maildev
    ports:
      - "1080:1080"
      - "1025:1025"
    networks:
      - microservices-net

  zipkin:
    container_name: zipkin
    image: openzipkin/zipkin
    ports:
      - "9411:9411"
    healthcheck:
      test: [ "CMD", "wget", "-qO-", "http://localhost:9411/" ]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 40s
    networks:
      - microservices-net

  keycloak:
    container_name: keycloak-ms
    image: quay.io/keycloak/keycloak:24.0.2
    ports:
      - "9098:8080"
    environment:
      KEYCLOAK_ADMIN: admin
      KEYCLOAK_ADMIN_PASSWORD: admin
      KC_HOSTNAME_STRICT: false
    networks:
      - microservices-net
    command:
      - "start-dev"

  config-server:
    container_name: config-server
    build:
      context: ./services/config-server
    ports:
      - "8888:8888"
    networks:
      - microservices-net
    restart: unless-stopped

  discovery-server:
    container_name: discovery-server
    build:
      context: ./services/discovery-server
    ports:
      - "8761:8761"
    depends_on:
      - config-server
    networks:
      - microservices-net
    restart: unless-stopped

  product-service:
    container_name: product-service
    build:
      context: ./services/product-service
    ports:
      - "8050:8050"
    depends_on:
      - postgres
      - discovery-server
      - config-server
    networks:
      - microservices-net
    restart: unless-stopped

  customer-service:
    container_name: customer-service
    build:
      context: ./services/customer-service
    ports:
      - "8090:8090"
    depends_on:
      - mongodb
      - discovery-server
      - config-server
    networks:
      - microservices-net
    restart: unless-stopped

  order-service:
    container_name: order-service
    build:
      context: ./services/order-service
    ports:
      - "8070:8070"
    depends_on:
      - postgres
      - kafka
      - discovery-server
      - config-server
    networks:
      - microservices-net
    restart: unless-stopped

  payment-service:
    container_name: payment-service
    build:
      context: ./services/payment-service
    ports:
      - "8060:8060"
    depends_on:
      - postgres
      - kafka
      - discovery-server
      - config-server
    networks:
      - microservices-net
    restart: unless-stopped

  notification-service:
    container_name: notification-service
    build:
      context: ./services/notification-service
    ports:
      - "8040:8040"
    depends_on:
      - mongodb
      - kafka
      - discovery-server
      - config-server
      - mail-dev
    networks:
      - microservices-net
    restart: unless-stopped

  gateway-service:
    container_name: gateway-service
    build:
      context: ./services/gateway-service
    ports:
      - "8080:8080"
    depends_on:
      - discovery-server
      - config-server
      - keycloak
    networks:
      - microservices-net
    restart: unless-stopped



networks:
    microservices-net:
      driver: bridge


volumes:
  postgres:
  pgadmin:
  mongo:
  kafka_data:
